openapi: 3.1.0
info:
  title: EntreApuntes Marketplace API
  version: 0.1.0
  summary: Contrato base del marketplace de apuntes.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Contrato de lecturas de publicaciones y cuenta del vendedor. Escritura de
    publicaciones, búsqueda avanzada, muestra y moderación vendrán después.
servers:
  - url: /api/v1
tags:
  - name: Listings
    description: Publicaciones aprobadas visibles sin iniciar sesión.
  - name: Seller listings
    description: Publicaciones privadas de la cuenta propietaria.
  - name: Admin listings
    description: Lectura administrativa de cualquier publicación.
  - name: Seller account
    description: Registro, sesión, verificación y recuperación de acceso.

paths:
  /auth/register:
    post:
      tags: [Seller account]
      operationId: registerSeller
      summary: Crear cuenta de vendedor y enviar verificación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedMessage' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [Seller account]
      operationId: loginSeller
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Sesión creada; establece cookie HttpOnly Secure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/session:
    get:
      tags: [Seller account]
      operationId: getSellerSession
      summary: Consultar sesión actual
      responses:
        '200':
          description: Sesión activa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      tags: [Seller account]
      operationId: logoutSeller
      summary: Cerrar sesión
      responses:
        '204': { description: Sesión revocada. }
  /auth/verification/request:
    post:
      tags: [Seller account]
      operationId: requestEmailVerification
      summary: Reenviar enlace de verificación
      responses:
        '202': { description: Solicitud aceptada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/verify-email:
    post:
      tags: [Seller account]
      operationId: verifySellerEmail
      summary: Consumir token de verificación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenInput' }
      responses:
        '204': { description: Correo verificado. }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/password-reset/request:
    post:
      tags: [Seller account]
      operationId: requestSellerPasswordReset
      summary: Solicitar recuperación sin revelar si existe el correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailInput' }
      responses:
        '202': { $ref: '#/components/responses/AcceptedMessage' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/password-reset/confirm:
    post:
      tags: [Seller account]
      operationId: resetSellerPassword
      summary: Consumir token y establecer contraseña nueva
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordInput' }
      responses:
        '204': { description: Contraseña actualizada; sesiones anteriores inválidas. }
        '400': { $ref: '#/components/responses/ValidationError' }

  /listings:
    get:
      tags: [Listings]
      operationId: listPublicListings
      summary: Listar publicaciones visibles
      security: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Solo publicaciones publicadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicListingPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /listings/{listingId}:
    get:
      tags: [Listings]
      operationId: getPublicListing
      summary: Obtener una publicación visible
      security: []
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Ficha pública.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicListingEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/listings:
    get:
      tags: [Seller listings]
      operationId: listMyListings
      summary: Listar mis publicaciones, incluidos borradores
      parameters:
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Publicaciones de la cuenta autenticada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateListingPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }

  /me/listings/{listingId}:
    get:
      tags: [Seller listings]
      operationId: getMyListing
      summary: Obtener una publicación propia
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Publicación privada de la cuenta autenticada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateListingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountUnavailable' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/listings/{listingId}:
    get:
      tags: [Admin listings]
      operationId: getAdminListing
      summary: Obtener una publicación para administración
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Publicación de cualquier estado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivateListingEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-aula_session
  parameters:
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
  schemas:
    EmailInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    RegisterInput:
      allOf:
        - $ref: '#/components/schemas/EmailInput'
        - type: object
          required: [name, password]
          properties:
            name: { type: string, minLength: 2, maxLength: 120 }
            password: { type: string, minLength: 12, maxLength: 128, format: password }
    LoginInput:
      allOf:
        - $ref: '#/components/schemas/EmailInput'
        - type: object
          required: [password, device_id, device_name]
          properties:
            password: { type: string, format: password }
            device_id: { type: string, format: uuid }
            device_name: { type: string }
            remember_me: { type: boolean }
    TokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
    SessionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, user, device_id, created_at, idle_expires_at, absolute_expires_at]
          properties:
            id: { type: string, format: uuid }
            user:
              type: object
              required: [id, name, email, role, status, email_verified, access_state, access_until, must_change_password]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [student, seller, admin] }
                status: { type: string, enum: [active, suspended, revoked] }
                email_verified: { type: boolean }
                access_state: { type: string, enum: [active, expired, suspended, revoked] }
                access_until: { type: [string, 'null'], format: date-time }
                must_change_password: { type: boolean }
            device_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            idle_expires_at: { type: string, format: date-time }
            absolute_expires_at: { type: string, format: date-time }
    CatalogItem:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    SellerSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ListingType:
      type: string
      enum: [note, guide, mock_exam, summary]
    ListingStatus:
      type: string
      enum: [draft, pending, published, rejected, paused, hidden, withdrawn]
    PublicListing:
      type: object
      required: [id, title, description, type, price_ars, full_page_count, subject, university, seller, published_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        type:
          oneOf:
            - $ref: '#/components/schemas/ListingType'
            - type: 'null'
        price_ars: { type: [integer, 'null'] }
        full_page_count: { type: [integer, 'null'] }
        subject:
          oneOf:
            - $ref: '#/components/schemas/CatalogItem'
            - type: 'null'
        university:
          oneOf:
            - $ref: '#/components/schemas/CatalogItem'
            - type: 'null'
        seller: { $ref: '#/components/schemas/SellerSummary' }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
    PrivateListing:
      allOf:
        - $ref: '#/components/schemas/PublicListing'
        - type: object
          required: [seller_id, status, revision, whatsapp_number, contact_consent, submitted_at]
          properties:
            seller_id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/ListingStatus' }
            revision: { type: integer, minimum: 1 }
            whatsapp_number: { type: [string, 'null'] }
            contact_consent: { type: boolean }
            submitted_at: { type: [string, 'null'], format: date-time }
    PublicListingPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PublicListing' }
    PublicListingEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PublicListing' }
    PrivateListingPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PrivateListing' }
    PrivateListingEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PrivateListing' }
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        request_id: { type: string, format: uuid }
  responses:
    AcceptedMessage:
      description: Solicitud aceptada sin revelar existencia de la cuenta.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
    ValidationError:
      description: Parámetro inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Sesión requerida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AccountUnavailable:
      description: Cuenta suspendida o revocada.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AdminRequired:
      description: Rol administrador requerido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Publicación inexistente o no visible.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

security:
  - sessionCookie: []
